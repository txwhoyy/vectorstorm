<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>VECTORSTORM — Neon Arena Protocol</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060f; }
  /* The stage keeps the game's 16:9 shape and letterboxes itself in any window. */
  #game {
    position: fixed; inset: 0; margin: auto; display: block; touch-action: none;
    width: min(100vw, 177.78vh); height: min(100vh, 56.25vw);
    background: #05060f;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Vectorstorm: pilot a lone ship against waves of geometric hunters. Move with W A S D or the arrow keys, aim with the mouse, hold click or Space to fire."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
